<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Director · Reference 原型（設計系統 + 殼層 + /video + 初剪）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../00_設計系統/theme.css">
<style>
  .pdrop{position:absolute;top:48px;left:0;width:300px;z-index:60;padding:8px}
  .vault-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:13px}
  .vcard{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-xs);transition:all var(--t) var(--ease)}
  .vcard:hover{border-color:var(--clay-soft);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
  .line2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .guided-body{padding:18px;overflow:auto}
  .actbar{display:flex;gap:8px;flex-wrap:wrap;padding:13px;border-top:1px solid var(--line)}
  .tip{font-family:var(--f-mono);font-size:9.5px;color:var(--muted-2);letter-spacing:.02em}
  .placeholder-shell{max-width:560px;margin:40px auto}
  .dmode{display:flex;gap:4px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line);overflow-x:auto}
  .dmode button{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:12px;padding:6px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:all var(--t) var(--ease)}
  .dmode button:hover{color:var(--text-soft);border-color:var(--line-strong)}
  .dmode button.on{background:linear-gradient(120deg,var(--clay-tint),var(--gold-tint));color:var(--clay-deep);border-color:var(--clay-soft)}
  .unbound{display:flex;align-items:center;gap:7px;margin:13px 15px 0;padding:8px 11px;border-radius:10px;background:var(--warn-tint);border:1px solid var(--gold-soft);color:var(--gold-deep);font-size:11.5px;flex-wrap:wrap}
  .orb-fab-wrap{position:fixed;right:22px;bottom:22px;z-index:150;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .orb-fab{width:58px;height:58px;border-radius:50%;border:1px solid var(--clay-soft);background:var(--surface);box-shadow:var(--shadow-lift);cursor:pointer;display:grid;place-items:center;transition:transform var(--t) var(--ease)}
  .orb-fab:hover{transform:scale(1.06) translateY(-2px)}
  .orb-bubble{width:262px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-lift);padding:12px;animation:slidein .24s var(--ease-out)}
  .orb-bubble .ob-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:5px}
  .orb-bubble .ob-t{font-size:12.5px;line-height:1.55;color:var(--text-soft)}
  .orb-panel{width:min(360px,92vw);max-height:72vh;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(253,251,247,.97),rgba(247,241,232,.96));backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-cmdk);overflow:hidden;animation:cmdkIn .2s var(--ease-out)}
  .op-h{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .op-tabs{display:flex;gap:3px;padding:9px 11px;border-bottom:1px solid var(--line);overflow-x:auto}
  .op-tabs button{border:0;background:transparent;color:var(--muted);font-size:11.5px;padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .op-tabs button.on{background:linear-gradient(120deg,var(--clay-tint),var(--gold-tint));color:var(--clay-deep)}
  .op-body{overflow:auto}
  .flow-wall{margin-top:10px;border-top:1px dashed var(--line-strong);padding-top:8px}
  .wf-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .wf-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
  .wf-grip{color:var(--muted-2);cursor:grab;font-size:12px;letter-spacing:-2px}
  .wf-name{font-size:13px;font-weight:600}
  /* —— 素材來源選擇器 + rough-cut 初剪 —— */
  .dropzone{border:2px dashed var(--line-strong);border-radius:var(--r-md);padding:26px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface-3);transition:all var(--t) var(--ease);line-height:1.8}
  .dropzone:hover{border-color:var(--clay-soft);color:var(--text-soft);background:var(--surface-2)}
  .gen-live{display:flex;gap:12px;align-items:center}
  .scanbox{position:relative;width:120px;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,#efe6d6,#e4d6c0);flex:none}
  .gen-done{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;background:var(--surface-2)}
  .gd-thumb{width:120px;aspect-ratio:16/10;border-radius:8px;flex:none}
  .jobchip{display:inline-block;font-family:var(--f-mono);font-size:9.5px;color:var(--muted-2);border:1px dashed var(--line-strong);border-radius:8px;padding:3px 8px;background:var(--wash)}
  .rc-preview{display:flex;flex-direction:column;gap:6px}
  .rc-frame{position:relative;aspect-ratio:16/7;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
  .rc-ph{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
  .rc-phbar{height:100%;background:linear-gradient(90deg,var(--clay),var(--gold));transition:width .5s var(--ease)}
  .rc-clip{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);padding:10px;margin-top:8px;transition:all var(--t) var(--ease)}
  .rc-clip.playing{border-color:var(--clay);box-shadow:0 0 0 2px var(--clay-ring)}
  .rc-thumb{width:96px;aspect-ratio:16/10;border-radius:8px;flex:none}
  .rc-export{border:1px solid rgba(92,138,85,.3);background:var(--ok-tint);border-radius:var(--r-md);padding:12px}
  @media(max-width:780px){.orb-fab-wrap{bottom:80px;right:14px}.rc-clip{flex-wrap:wrap}.rc-thumb{width:72px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div class="toasts" id="toasts"></div>
<script src="./app.js"></script>
<script src="./app2.js"></script>
</body>
</html>
