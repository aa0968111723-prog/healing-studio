      summary: Poll fal.ai queue status for a generation job
      tags: [videoStudio]
      description: >
        Wraps `GET fal.ai/queue/<model>/requests/<request_id>/status`.
        Returns the raw fal.ai status payload (`IN_QUEUE`, `IN_PROGRESS`,
        `COMPLETED`, or `FAILED`).
      parameters:
        - name: input
          in: query
          required: true
          schema:
            type: object
            properties:
              requestId:
                type: string
              modelId:
                type: string
                description: The fal.ai model ID used when the job was submitted.
            required: [requestId, modelId]
          style: form
          explode: true
      responses:
        "200":
          description: fal.ai queue status (shape varies by model).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [IN_QUEUE, IN_PROGRESS, COMPLETED, FAILED]
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/trpc/videoStudio.checkVideoStatus:
    get:
      operationId: videoStudio_checkVideoStatus
      summary: Fetch completed video result and persist to digital asset library
      tags: [videoStudio]
      description: >
        Polls the fal.ai result endpoint.  On `COMPLETED`, extracts the video
        URL, stores the asset in `digital_asset_library`, and returns an HMAC-
        signed `/api/video-output` proxy URL that never exposes the raw CDN URL
        to the frontend.
      parameters:
        - name: input
          in: query
          required: true
          schema:
            type: object
            properties:
              requestId:
                type: string
              modelId:
                type: string
            required: [requestId, modelId]
          style: form
          explode: true
      responses:
        "200":
          description: Completed video details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [IN_QUEUE, IN_PROGRESS, COMPLETED, FAILED]
                  video_url:
                    type: string
                    format: uri
                    description: >
                      HMAC-signed `/api/video-output` proxy URL (1 h TTL).
                      Present only when `status = COMPLETED`.
                  asset_id:
                    type: integer
                    description: ID of the persisted `digital_asset_library` row.
                  duration_sec:
                    type: number
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

# ════════════════════════════════════════════════════════════════════════════
# Paths — Express: HMAC-signed video output proxy
# ════════════════════════════════════════════════════════════════════════════

  /api/video-output:
    get:
      operationId: videoOutput_get
      summary: HMAC-signed video redirect proxy
      tags: [videoOutput]
      description: |
        Issues a `302 Found` redirect to the actual fal.ai CDN video URL
        after verifying:

        1. The caller is authenticated (JWT cookie / `Authorization` header).
        2. `HMAC-SHA256("v1:<r>:<u>:<e>", JWT_SECRET) === t`
        3. The signed expiry `e` is in the future (1 h window).
        4. The job's `userId` matches the authenticated user (BOLA guard).

        The signed URL is generated by `checkVideoStatus` and has a 1-hour
        TTL.  **Do not call this endpoint directly** — obtain the URL from
        `checkVideoStatus.video_url`.

        On any verification failure the endpoint returns `403` with no detail
        leak (`{ "error": "Forbidden" }`).
      security:
        - BearerAuth: []
      parameters:
        - name: r
          in: query
          required: true
          schema:
            type: string
          description: fal.ai `request_id`.
        - name: u
          in: query
          required: true
          schema:
            type: integer
          description: Authenticated user ID (must match session).
        - name: e
          in: query
          required: true
          schema:
            type: integer
          description: Unix timestamp (seconds) at which the signature expires.
        - name: t
          in: query
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature.
      responses:
        "302":
          description: Redirect to the raw fal.ai CDN video URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "403":
          description: Authentication failed, ownership mismatch, or signature invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
                required: [error]
