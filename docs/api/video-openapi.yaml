            application/json:
              schema:
                type: object
                properties:
                  prompt:
                    type: string
                  shotCount:
                    type: integer
                  estimatedDurationSec:
                    type: number
                  cameraMode:
                    type: string
                  cameraStabilityScore:
                    type: number
                  styleTag:
                    type: string
                  aspectRatio:
                    type: string
                  emotionTranslations:
                    type: object
                    additionalProperties: true
                  jumpBlockCount:
                    type: integer
                required: [prompt]
        "401":
          $ref: "#/components/responses/Unauthorized"

