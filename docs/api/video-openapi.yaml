  /api/trpc/videoStudio.compilePrompt:
    post:
      operationId: videoStudio_compilePrompt
      summary: Compile creative blocks into a fal.ai generation prompt
      tags: [videoStudio]
      description: >
        Converts mood/subject/action/camera building blocks plus free-text
        into a structured prompt ready for any T2V or I2V model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blocks:
                  type: array
                  maxItems: 20
                  default: []
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      category:
                        type: string
                        enum: [subject, action, environment, camera, mood, style]
                      label:
                        type: string
                      prompt:
                        type: string
                    required: [id, category, label, prompt]
                freePrompt:
                  type: string
                  maxLength: 2500
                moodKeywords:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    maxLength: 60
                targetDurationSec:
                  type: integer
                  minimum: 3
                  maximum: 20
                forceCameraMode:
                  type: string
                  enum:
                    - static
                    - dolly_in
                    - dolly_out
                    - pan_left
                    - pan_right
                    - tilt_up
                    - tilt_down
                    - orbit
                    - crane_up
                    - crane_down
                    - tracking
                    - handheld
                    - aerial_descent
                    - aerial_ascent
                    - push_in
                    - pull_out
                firstFrameUrl:
                  type: string
                  format: uri
                lastFrameUrl:
                  type: string
                  format: uri
                aspectRatio:
                  type: string
                  enum: ["16:9", "9:16", "1:1", "4:3"]
                slowMotion:
                  type: boolean
                styleOverride:
                  type: string
                  maxLength: 80
              additionalProperties: false
      responses:
