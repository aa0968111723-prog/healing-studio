[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT automatically. The app reads process.env.PORT (set by Railway).
# --max-old-space-size=400 prevents OOM on Railway Hobby plan (512MB RAM limit).
# Do NOT hardcode the port here — Railway sets PORT env var to its internal routing port.
startCommand = "node --max-old-space-size=400 /app/dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# cache bust: 2026-04-12T09:50
